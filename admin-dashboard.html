<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--
        LEGACY PAGE - deliberately contains no administrator content.

        This file previously WAS the administrator dashboard: a static page
        that anyone could open without logging in. It displayed fixed sample
        totals and listed bookings read from browser localStorage.

        That was a security defect, so all of it has been removed. The real
        dashboard is now admin-dashboard.php, which is protected by
        require_admin() and is reachable only by an account whose role is
        'admin'.

        This page must never display administrator information, booking data
        or totals. It exists only so that old links and bookmarks land
        somewhere sensible instead of on a 404.
    -->

    <title>Administrator Area - Hotel Booking System</title>
    <link rel="stylesheet" href="css.css">
</head>
<body>

<main class="container">
    <div class="legacy-notice">
        <p class="logo">HOTEL BOOKING SYSTEM</p>

        <h1>Administrator Area</h1>

        <p>
            The administrator dashboard has moved and now requires you to be
            signed in with an administrator account.
        </p>

        <p class="form-footer">
            <a href="login.php">Go to the login page</a>
        </p>

        <p class="form-footer">
            <a href="index.html">Return to the home page</a>
        </p>
    </div>
</main>

</body>
</html>
