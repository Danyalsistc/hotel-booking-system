<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Now</title>
    <link rel="stylesheet" href="booknow.css">
</head>
<body>
    <!-- Back Button at Top Right -->
    <a href="index.html" class="back-btn">&#x2190;</a>

    <section class="book-now-form">
        <form id="bookingForm" action="#" method="post">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name">
                <small id="nameError" class="error-message"></small>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="text" id="email" name="email" placeholder="Enter your email address">
                <small id="emailError" class="error-message"></small>
            </div>
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="text" id="phone" name="phone" placeholder="Enter your phone number">
                <small id="phoneError" class="error-message"></small>
            </div>
            <div class="form-group">
                <label for="roomType">Room Type:</label>
                <select id="roomType" name="roomType">
                    <option value="Standard Twin Room">Standard Twin Room</option>
                    <option value="Executive Twin Room">Executive Twin Room</option>
                    <option value="Superior Suite">Superior Suite</option>
                    <option value="Deluxe Suite">Deluxe Suite</option>
                    <option value="Executive Suite">Executive Suite</option>
                    <option value="Presidential Suite">Presidential Suite</option>
                </select>
            </div>
            <div class="form-group">
                <label for="persons">Number of Persons:</label>
                <input type="text" id="persons" name="persons">
                <small id="personsError" class="error-message"></small>
            </div>
            <div class="form-group">
                <label for="checkin">Check-in Date</label>
                <input type="text" id="checkin" name="checkin" placeholder="YYYY-MM-DD">
                <small id="checkinError" class="error-message"></small>
            </div>
            <div class="form-group">
                <button type="submit" class="submit-btn">Book Now</button>
            </div>
        </form>
    </section>

    <footer>
        <p>&copy; 2025 Hotel Booking System. All Rights Reserved.</p>
    </footer>

    <script src="booknow.js"></script>
</body>
</html>
