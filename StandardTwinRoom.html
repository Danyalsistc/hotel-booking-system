<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StandardTwinRoom</title>
    <link rel="stylesheet" href="room.css">
</head>
<body>
    

    <!-- Banner Section -->
    <section class="room-banner">
        <div class="banner-content">
            <p>.    .   .   .   .   </p>
            <!--a href="index.html" class="back-btn">Back to Rooms</a-->
        </div>
    </section>

     <!-- Room Details Section -->
     <section class="room-details">
        <div class="room-gallery">
            <img src="images/StandardTwinRoom/1.jpg" alt="Single Room Main View" class="main-image">
            <div class="thumbnails">
                <img src="images/StandardTwinRoom/2.jpg" alt="Thumbnail 1">
                <img src="images/StandardTwinRoom/3.jpg" alt="Thumbnail 2">
                <img src="images/StandardTwinRoom/4.jpg" alt="Thumbnail 3">
            </div>
        </div>
        <!-- Standard Twin Room -->
        <div class="room-info">
            <h2>Standard Twin Room</h2>
            <ul>
                <li><strong>Bed Type:</strong> 2 Single Beds</li>
                <li><strong>Room Size:</strong> 25 sqm</li>
                <li><strong>Room Facilities:</strong> 
                    <ul>
                        <li>Air conditioning,</li>
                        <li>Free Wi-Fi, </li>
                        <li>TV, </li>
                        <li>Mini Fridge, </li>
                        <li>Coffee Maker, </li>
                        <li>Bathtub</li>
                    </ul>
                </li>
                <li><strong>Price Per Night:</strong> $100</li>
            </ul>
            <button onclick="checkAvailability('Standard Twin Room')" class="btn">Check Availability</button>
            <button onclick="goToBooking('Standard Twin Room')" class="btn">Book Now</button>
        </div>
    </section>
    

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 Hotel Booking System. All Rights Reserved.</p>
    </footer>

    <script src="room.js"></script>
    
</body>
</html>
