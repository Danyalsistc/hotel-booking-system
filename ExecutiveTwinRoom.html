<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suite Room</title>
    <link rel="stylesheet" href="room.css">
</head>
<body>

    <!-- Banner Section -->
    <section class="room-banner">
        <div class="banner-content">
            <p>.    .   .   .   .   </p>
            <!--a href="index.html" class="back-btn">Back to Rooms</a-->
        </div>
    </section>

      <!-- Room Details Section -->
      <section class="room-details">
            <div class="room-gallery">
                <img src="images/ExecutiveTwinRoom/5.jpg" alt="Single Room Main View" class="main-image">
                <div class="thumbnails">
                    <img src="images/ExecutiveTwinRoom/3.jpg" alt="Thumbnail 1">
                    <img src="images/ExecutiveTwinRoom/2.avif" alt="Thumbnail 2">
                    <img src="images/ExecutiveTwinRoom/4.jpg" alt="Thumbnail 3">
                </div>
            </div>

          <div class="room-info">
            <h2>Executive Twin Room</h2>
            <ul>
                <li><strong>Bed Type:</strong> 2 Single Beds</li>
                <li><strong>Room Size:</strong> 30 sqm</li>
                <li><strong>Room Facilities:</strong> 
                    <ul>
                        <li>Air conditioning,</li>
                        <li>Free Wi-Fi, </li>
                        <li>TV, </li>
                        <li>Mini Fridge, </li>
                        <li>Coffee Maker, </li>
                        <li>Bathtub</li>
                    </ul>
                </li>
                <li><strong>Price Per Night:</strong> $150</li>
            </ul>
            <button onclick="checkAvailability('executiveTwin')" class="btn">Check Availability</button>
            <button onclick="window.location.href='booknow.html'" class="btn">Book Now</button>
        </div>
        </section>
    
    

    <footer>
        <p>&copy; 2025 Hotel Booking System. All Rights Reserved.</p>
    </footer>

    <script src="room.js"></script>
    
</body>
</html>
